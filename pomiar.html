<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomiar terenowy</title>
<meta name="description" content="Notatnik pomiaru terenowego: momenty zatrzymania, drzwi i ruszenia pojazdów na przystanku.">
<link rel="stylesheet" href="styl.css?v=0e48dbc602">
<style>
  body { padding-bottom: 96px; }
  .zegar { font: 600 28px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .pasek-gora { position: sticky; top: 0; z-index: 5; background: var(--tlo); padding: 10px 0;
                border-bottom: 1px solid var(--linia); display: flex; gap: 12px; align-items: center;
                flex-wrap: wrap; max-width: 720px; margin: 0 auto; }
  .szukaj { position: relative; flex: 1 1 200px; min-width: 0; }
  .szukaj input { width: 100%; font-size: 16px; }
  .podpowiedzi { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
                 background: var(--tlo); border: 1px solid var(--linia); border-radius: 10px;
                 max-height: 55vh; overflow-y: auto; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  .podpowiedzi button { display: block; width: 100%; text-align: left; padding: 12px; min-height: 48px;
                        border: 0; border-bottom: 1px solid var(--linia); background: none; color: var(--tekst);
                        font: 15px/1.3 system-ui, sans-serif; touch-action: manipulation; }
  .podpowiedzi button small { display: block; color: var(--tekst-2); font-size: 12px; margin-top: 2px; }
  .podpowiedzi .pusto { padding: 12px; color: var(--tekst-2); font-size: 14px; }
  .pasek-gora input { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--linia);
                       background: var(--tlo); color: var(--tekst); flex: 1 1 200px; min-width: 0; }
  .karty, .lista { max-width: 720px; margin: 12px auto; display: grid; gap: 12px; }
  .karta { background: var(--tlo-2); border-radius: 12px; padding: 12px; border: 2px solid transparent; }
  .karta.blad { border-color: #e34948; }
  .pola { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .pola input { font: 600 20px/1.2 system-ui, sans-serif; padding: 10px; border-radius: 8px; width: 100%;
                border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .pola label { font-size: 12px; color: var(--tekst-2); display: flex; flex-direction: column; gap: 4px; }
  .przyciski { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .przyciski button { min-height: 64px; font: 600 17px/1.2 system-ui, sans-serif; border-radius: 10px;
                      border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst);
                      touch-action: manipulation; }
  .przyciski button.zrobione { background: var(--akcent); color: #fff; border-color: var(--akcent); }
  .przyciski button small { display: block; font: 500 13px/1.2 ui-monospace, Menlo, monospace; opacity: .9; margin-top: 4px; }
  .przyciski button.drugie { min-height: 48px; font-size: 15px; }
  .stopka-karty { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .stopka-karty button, .dol button { font: 600 15px system-ui, sans-serif; padding: 10px 14px; border-radius: 8px;
                      border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .stopka-karty .zakoncz { margin-left: auto; background: var(--tekst); color: var(--tlo); }
  .komunikat { font-size: 14px; color: #e34948; min-height: 1.2em; margin-top: 6px; }
  .wyniki { font: 13px ui-monospace, Menlo, monospace; color: var(--tekst-2); }
  details { margin-top: 8px; font-size: 14px; }
  details label { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  details input[type=text] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--linia);
                             background: var(--tlo); color: var(--tekst); font: inherit; }
  .dol { position: fixed; left: 0; right: 0; bottom: 0; background: var(--tlo); border-top: 1px solid var(--linia);
         padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .dol { flex-wrap: nowrap; } .dol button { padding: 10px 12px; white-space: nowrap; }
  .dol .glowny { background: var(--akcent); color: #fff; border-color: var(--akcent); font-size: 18px; padding: 12px 18px; }
  .pasazerowie { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 4px; }
  .licznik { display: flex; align-items: center; gap: 6px; background: var(--tlo); border: 1px solid var(--linia);
             border-radius: 10px; padding: 6px 6px 6px 10px; }
  .licznik span { flex: 1; font-size: 14px; } .licznik b { font-size: 20px; margin-left: 4px; }
  .licznik button { min-width: 48px; min-height: 48px; font: 700 22px system-ui; border-radius: 8px;
                    border: 1px solid var(--linia); background: var(--tlo-2); color: var(--tekst); touch-action: manipulation; }
  .licznik button.minus { min-width: 36px; font-size: 18px; }
  .drzwi { font-size: 12px; color: var(--tekst-2); display: flex; flex-direction: column; gap: 4px; }
  .drzwi select { font: 16px system-ui; padding: 8px; border-radius: 8px; border: 1px solid var(--linia);
                  background: var(--tlo); color: var(--tekst); }
  .tlok { display: flex; gap: 4px; align-items: end; }
  .tlok button { flex: 1; min-height: 40px; font-size: 12px; border-radius: 8px; border: 1px solid var(--linia);
                 background: var(--tlo); color: var(--tekst); }
  .tlok button.zrobione { background: var(--akcent); color: #fff; border-color: var(--akcent); }
  .tryby { display: flex; gap: 6px; max-width: 720px; margin: 8px auto 0; }
  .tryby button { flex: 1; min-height: 44px; font: 600 15px system-ui, sans-serif; border-radius: 10px;
                  border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .tryby button.zrobione { background: var(--akcent); color: #fff; border-color: var(--akcent); }
  [hidden] { display: none !important; }
  .nz { font-weight: 600; color: var(--bursztyn-tekst); margin: 0; }
  .przyciski.nie-stanal { margin: 4px 0 8px; }
  .przyciski.nie-stanal button { min-height: 56px; border: 2px solid #e3a008; }
  .plan-przycisk { font: 600 13px system-ui, sans-serif; padding: 4px 10px; border-radius: 6px; margin-left: 6px;
                   border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  #plan { max-width: 720px; margin: 8px auto; }
  #jazda { max-width: 720px; margin: 12px auto; }
  .biezacy .szukaj { flex: none; }
  .pasazerowie { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .licznik { min-width: 0; padding-left: 8px; gap: 4px; }
  .licznik span { min-width: 0; font-size: 13px; }
  .glowny-duzy { width: 100%; min-height: 64px; font: 600 18px system-ui, sans-serif; border-radius: 12px;
                 border: 0; background: var(--akcent); color: #fff; }
  .kierunki { margin-bottom: 10px; flex-wrap: wrap; } .kierunki button { min-height: 44px; font-size: 14px; }
  .biezacy { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .biezacy select { font: 600 18px system-ui, sans-serif; padding: 10px; border-radius: 8px; width: 100%;
                    border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .biezacy input { font: 15px system-ui, sans-serif; padding: 8px; border-radius: 8px; border: 1px solid var(--linia);
                   background: var(--tlo); color: var(--tekst); }
  #jazda details input { width: 100%; }
  .biezacy-wiersz { display: flex; gap: 6px; }
  .biezacy-wiersz select { flex: 1; min-width: 0; }
  .biezacy-wiersz button { min-width: 48px; font: 600 18px system-ui, sans-serif; border-radius: 8px;
                           border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .biezacy-wiersz button:disabled { opacity: .35; }
  .znaczniki { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
  .znaczniki button { min-height: 52px; font: 600 13px/1.2 system-ui, sans-serif; border-radius: 8px; padding: 6px 4px;
                      border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); touch-action: manipulation; }
  .znaczniki button small { display: block; font: 500 11px/1.2 system-ui, sans-serif; color: var(--tekst-2); margin-top: 3px; }
  .znaczniki button.trwa { border: 2px solid #e3a008; }
  .znaczniki button.zrobione { background: var(--akcent); color: #fff; border-color: var(--akcent); }
  .znaczniki button.zrobione small { color: #fff; }
  .uwaga-przyst { width: 100%; margin-top: 8px; font: 15px system-ui, sans-serif; padding: 8px; border-radius: 8px;
                  border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .korekta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; padding: 8px;
             border: 2px solid #e3a008; border-radius: 10px; font-size: 14px; }
  .korekta span { flex-basis: 100%; }
  .korekta .usun-moment { flex-basis: 100%; color: #e34948; }
  .korekta button { flex: 1; min-height: 44px; font: 600 15px system-ui, sans-serif; border-radius: 8px;
                    border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); touch-action: manipulation; }
  .zegar-jazdy { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 40px; gap: 4px; margin: 8px 0; }
  .zegar-jazdy button { min-height: 50px; font: 600 12px/1.15 system-ui, sans-serif; border-radius: 8px; padding: 4px 2px;
                        border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); touch-action: manipulation; }
  .zegar-jazdy button small { display: block; font: 500 10px/1.2 ui-monospace, Menlo, monospace; color: var(--tekst-2); margin-top: 2px; }
  .zegar-jazdy button.zrobione { background: var(--akcent); color: #fff; border-color: var(--akcent); }
  .zegar-jazdy button.zrobione small { color: #fff; }
  .obc-wiersz { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; margin-top: 10px; }
  .obc-wiersz .obciazenie input { width: 100%; }
  .obc-wiersz .drzwi select { width: 100%; }
  .obciazenie { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--tekst-2); margin-top: 10px; }
  .obciazenie input { font: 600 18px system-ui, sans-serif; padding: 8px 10px; border-radius: 8px; width: 9em;
                      border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .podpowiedzi { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .szybkie { display: grid; gap: 8px; max-width: 720px; margin: 10px auto 0; min-width: 0; }
  .szybkie:empty { display: none; }
  .pasazerowie .tlok { grid-column: 1 / -1; }
  /* 30.09: 1. nazwa (pole, kolor akcentu) i 2. kierunek (przyciski,
     bursztynowe) wyraznie rozne; ostatnio uzywane - szare, male */
  :root { --bursztyn-tekst: #a15c07; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bursztyn-tekst: #f0b429; } }
  :root[data-theme="dark"] { --bursztyn-tekst: #f0b429; }
  .etyk { display: block; font: 600 12px system-ui, sans-serif; color: var(--tekst-2); margin-bottom: 4px; }
  .szukaj .etyk { color: var(--akcent); }
  #przystanek { border: 2px solid var(--akcent); font-weight: 600; }
  .kier-lista { display: grid; gap: 6px; }
  .kier-wiersz .etyk { color: var(--bursztyn-tekst); }
  .kier-wiersz.brak .kier-lista { padding: 4px; border-radius: 10px; outline: 2px dashed #e3a008; }
  .szybkie button.kier { font: 15px/1.25 system-ui, sans-serif; padding: 8px 12px; min-height: 48px; border-radius: 10px;
                         border: 2px solid #e3a008; background: rgba(227,160,8,.10); color: var(--tekst); text-align: left; }
  .szybkie button.kier b { font-weight: 600; }
  .szybkie button.kier small { display: block; font-size: 12px; color: var(--tekst-2); margin-top: 2px; }
  .szybkie button.kier.zrobione { background: #e3a008; color: #1a1a1a; }
  .szybkie button.kier.zrobione small { color: #3d2a00; }
  .szybkie .zmien-kier { justify-self: start; font: 600 13px system-ui, sans-serif; padding: 6px 10px; min-height: 34px;
                         border-radius: 8px; border: 1px dashed #e3a008; background: none; color: var(--bursztyn-tekst); }
  .ostatnie { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .ostatnie::-webkit-scrollbar { display: none; }
  .ostatnie .etyk { display: inline; margin: 0; flex: none; }
  .ostatnie button { font: 13px/1.2 system-ui, sans-serif; padding: 6px 10px; min-height: 34px; border-radius: 8px;
                     border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst-2); flex: none; white-space: nowrap; }
  .przyst-karty { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap;
                  font: 600 15px system-ui, sans-serif; margin-bottom: 8px; }
  .w-strone { display: inline-block; font: 600 13px system-ui, sans-serif; color: var(--bursztyn-tekst);
              border: 1px solid #e3a008; border-radius: 12px; padding: 1px 8px; }
  .przyst-karty button { font: 13px system-ui, sans-serif; padding: 6px 10px; border-radius: 8px;
                         border: 1px solid #e3a008; background: var(--tlo); color: var(--tekst); }
  button.wiersz { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--linia); color: var(--tekst);
                  text-align: left; font: 14px system-ui, sans-serif; padding: 10px 0; }
  .lista .wiersz { font-size: 14px; display: flex; justify-content: space-between; gap: 8px;
                   border-bottom: 1px solid var(--linia); padding: 6px 0; }
  /* 28.09: role i sekcje w kolorach - zegar niebieski, liczenie zielone, znaczniki bursztynowe */
  .role { display: flex; gap: 4px; max-width: 720px; margin: 6px auto 0; }
  .role button { flex: 1; min-height: 36px; font: 600 12px/1.1 system-ui, sans-serif; border-radius: 8px; padding: 4px;
                 border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .role button.zrobione { background: var(--tekst); color: var(--tlo); border-color: var(--tekst); }
  .role input { width: 5.5em; font: 600 14px system-ui, sans-serif; padding: 6px; border-radius: 8px; text-align: center;
                border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); text-transform: uppercase; }
  .sekcja { border-left: 5px solid; border-radius: 6px; padding: 6px 6px 6px 8px; margin: 8px 0; }
  .sek-zegar { border-color: #2f6fd6; background: rgba(47, 111, 214, .08); }
  .sek-liczenie { border-color: #1f9d55; background: rgba(31, 157, 85, .08); }
  .sek-znaczniki { border-color: #e3a008; background: rgba(227, 160, 8, .08); }
  .sekcja .pasazerowie, .sekcja .znaczniki, .sekcja .zegar-jazdy { margin-top: 0; }
  .sek-zegar .przyciski button.zrobione, .sek-zegar .zegar-jazdy button.zrobione { background: #2f6fd6; border-color: #2f6fd6; }
  .zegar-jazdy { grid-template-columns: 1fr 1fr 1fr 1fr 44px; gap: 6px; }
  .zegar-jazdy button { min-height: 68px; font-size: 15px; }
  .zegar-jazdy button small { font-size: 11px; }
  .zegar-jazdy button.edytowane { outline: 3px solid #e3a008; }
  .sekcja .licznik { flex-wrap: wrap; padding: 6px; }
  .sekcja .licznik span { flex-basis: 100%; font-size: 14px; }
  .sekcja .licznik button { flex: 1; min-width: 0; }
  .licznik button.piec { font-size: 15px; }
  .sek-zegar .zegar-jazdy { grid-template-columns: 1fr 1fr 1fr 1fr 34px; gap: 4px; }
  .sek-zegar .zegar-jazdy button { padding: 4px 1px; font-size: 14px; }
  .szac { grid-column: 1 / -1; min-height: 40px; font: 600 13px system-ui, sans-serif; border-radius: 8px;
          border: 1px dashed var(--linia); background: var(--tlo); color: var(--tekst-2); }
  .szac.zrobione { border: 2px solid #1f9d55; color: var(--tekst); }
  /* 29.09: drugie zatrzymanie w jezdzie, ponowne otwarcie drzwi, powod czekania */
  .zegar-jazdy2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
  .zegar-jazdy2 button { min-height: 46px; font: 600 12px/1.15 system-ui, sans-serif; border-radius: 8px; padding: 4px 2px;
                         border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); touch-action: manipulation; }
  .zegar-jazdy2 button small { display: block; font: 500 10px/1.2 ui-monospace, Menlo, monospace; color: var(--tekst-2); }
  .zegar-jazdy2 button.zrobione { background: #2f6fd6; border-color: #2f6fd6; color: #fff; }
  .zegar-jazdy2 button.zrobione small { color: #fff; }
  .ponowne { min-height: 40px; font: 600 12px/1.15 system-ui, sans-serif; border-radius: 8px; padding: 4px 6px;
             border: 1px dashed var(--linia); background: var(--tlo); color: var(--tekst); touch-action: manipulation; }
  /* 02.10: wlasny wiersz (nie pod "Ruszyl"), obok cofniecie */
  .ponowne-wiersz { display: flex; gap: 6px; margin-top: 8px; }
  .ponowne-wiersz .ponowne { flex: 1; }
  .ponowne-wiersz .cofnij-ponowne { flex: 0 0 45%; border-style: solid; }
  .cofnij-ponowne small { display: block; font: 500 11px/1.2 ui-monospace, Menlo, monospace; color: var(--tekst-2); margin-top: 2px; }
  .znaczniki { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); margin-top: 0; }
  .powody span { flex-basis: 100%; }
  .powody { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--tekst-2); }
  .powody button { flex: 1; min-height: 36px; font: 600 12px system-ui, sans-serif; border-radius: 8px; padding: 2px 6px;
                   border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); touch-action: manipulation; }
  .powody button.zrobione { background: #e3a008; border-color: #e3a008; color: #111; }
  /* iPhone/Safari (30.09, lag u N.): pole < 16 px powieksza strone przy
     dotknieciu, a szybkie dwa dotkniecia przycisku - podwojne powiekszenie */
  button, select, input { touch-action: manipulation; }
  .pasek-gora input, details input[type=text], .biezacy input, .uwaga-przyst, #obserwator { font-size: 16px; }
</style>
</head>
<body>
<header style="max-width:720px;margin:0 auto">
  <h1 style="font-size:20px;margin:12px 0 2px">Pomiar terenowy</h1>
  <p class="drobny">Instrukcja: <a href="https://github.com/JedrzejF/ztm-poznan-web/blob/main/POMIAR.md">POMIAR.md</a>. Czas z zegara telefonu — musi być ustawiany automatycznie. <button type="button" class="plan-przycisk" id="plan-przycisk">Plan dnia</button></p>
  <div class="tryby" role="tablist">
    <button type="button" data-tryb="postoj">Na przystanku</button>
    <button type="button" data-tryb="jazda">Jadę pojazdem</button>
  </div>
  <div class="role">
    <button type="button" data-rola="zegar_liczenie">zegar + liczenie</button>
    <button type="button" data-rola="zegar">tylko zegar</button>
    <button type="button" data-rola="liczenie">tylko liczenie</button>
    <input id="obserwator" type="text" maxlength="4" placeholder="inicjały" aria-label="Twoje inicjały"
           autocomplete="off" autocapitalize="characters" spellcheck="false">
  </div>
</header>
<div class="pasek-gora">
  <span class="zegar" id="zegar">--:--:--</span>
  <div class="szukaj">
    <span class="etyk">1. Przystanek</span>
    <input id="przystanek" type="search" placeholder="wpisz nazwę (2+ litery)" aria-label="Przystanek"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    <div id="podpowiedzi" class="podpowiedzi" role="listbox" hidden></div>
  </div>
</div>
<div id="szybkie" class="szybkie"></div>

<section class="karty" id="karty" aria-live="polite"></section>
<section class="lista" id="lista"></section>
<section id="jazda" hidden></section>
<section id="plan" hidden></section>

<div class="dol">
  <button class="glowny" id="nowy" type="button">+ Pojazd</button>
  <button id="eksport" type="button">Eksport CSV</button>
  <button id="wyczysc" type="button">Wyczyść</button>
</div>

<script src="plan.js?v=b4422aa6dc"></script>
<script src="pomiar-logika.js?v=ad82355834"></script>
<script src="pomiar.js?v=1ffa210d54"></script>
</body>
</html>
