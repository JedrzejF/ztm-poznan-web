<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomiar postoju</title>
<meta name="description" content="Notatnik pomiaru terenowego: momenty zatrzymania, drzwi i ruszenia pojazdów na przystanku.">
<link rel="stylesheet" href="styl.css?v=0e48dbc602">
<style>
  body { padding-bottom: 96px; }
  .zegar { font: 600 28px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .pasek-gora { position: sticky; top: 0; z-index: 5; background: var(--tlo); padding: 10px 0;
                border-bottom: 1px solid var(--linia); display: flex; gap: 12px; align-items: center;
                flex-wrap: wrap; max-width: 720px; margin: 0 auto; }
  .pasek-gora select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--linia);
                       background: var(--tlo); color: var(--tekst); flex: 1 1 200px; min-width: 0; }
  .karty, .lista { max-width: 720px; margin: 12px auto; display: grid; gap: 12px; }
  .karta { background: var(--tlo-2); border-radius: 12px; padding: 12px; border: 2px solid transparent; }
  .karta.blad { border-color: #e34948; }
  .pola { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .pola input { font: 600 20px/1.2 system-ui, sans-serif; padding: 10px; border-radius: 8px; width: 100%;
                border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .pola label { font-size: 12px; color: var(--tekst-2); display: flex; flex-direction: column; gap: 4px; }
  .przyciski { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .przyciski button { min-height: 64px; font: 600 17px/1.2 system-ui, sans-serif; border-radius: 10px;
                      border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst);
                      touch-action: manipulation; }
  .przyciski button.zrobione { background: var(--akcent); color: #fff; border-color: var(--akcent); }
  .przyciski button small { display: block; font: 500 13px/1.2 ui-monospace, Menlo, monospace; opacity: .9; margin-top: 4px; }
  .przyciski button.drugie { min-height: 48px; font-size: 15px; }
  .stopka-karty { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .stopka-karty button, .dol button { font: 600 15px system-ui, sans-serif; padding: 10px 14px; border-radius: 8px;
                      border: 1px solid var(--linia); background: var(--tlo); color: var(--tekst); }
  .stopka-karty .zakoncz { margin-left: auto; background: var(--tekst); color: var(--tlo); }
  .komunikat { font-size: 14px; color: #e34948; min-height: 1.2em; margin-top: 6px; }
  .wyniki { font: 13px ui-monospace, Menlo, monospace; color: var(--tekst-2); }
  details { margin-top: 8px; font-size: 14px; }
  details label { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  details input[type=text] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--linia);
                             background: var(--tlo); color: var(--tekst); font: inherit; }
  .dol { position: fixed; left: 0; right: 0; bottom: 0; background: var(--tlo); border-top: 1px solid var(--linia);
         padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .dol .glowny { background: var(--akcent); color: #fff; border-color: var(--akcent); font-size: 18px; padding: 12px 22px; }
  .pasazerowie { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 4px; }
  .licznik { display: flex; align-items: center; gap: 6px; background: var(--tlo); border: 1px solid var(--linia);
             border-radius: 10px; padding: 6px 6px 6px 10px; }
  .licznik span { flex: 1; font-size: 14px; } .licznik b { font-size: 20px; margin-left: 4px; }
  .licznik button { min-width: 48px; min-height: 48px; font: 700 22px system-ui; border-radius: 8px;
                    border: 1px solid var(--linia); background: var(--tlo-2); color: var(--tekst); touch-action: manipulation; }
  .licznik button.minus { min-width: 36px; font-size: 18px; }
  .drzwi { font-size: 12px; color: var(--tekst-2); display: flex; flex-direction: column; gap: 4px; }
  .drzwi select { font: 16px system-ui; padding: 8px; border-radius: 8px; border: 1px solid var(--linia);
                  background: var(--tlo); color: var(--tekst); }
  .tlok { display: flex; gap: 4px; align-items: end; }
  .tlok button { flex: 1; min-height: 40px; font-size: 12px; border-radius: 8px; border: 1px solid var(--linia);
                 background: var(--tlo); color: var(--tekst); }
  .tlok button.zrobione { background: var(--akcent); color: #fff; border-color: var(--akcent); }
  .lista .wiersz { font-size: 14px; display: flex; justify-content: space-between; gap: 8px;
                   border-bottom: 1px solid var(--linia); padding: 6px 0; }
</style>
</head>
<body>
<header style="max-width:720px;margin:0 auto">
  <h1 style="font-size:20px;margin:12px 0 2px">Pomiar postoju</h1>
  <p class="drobny">Instrukcja: <a href="https://github.com/JedrzejF/ztm-poznan-web/blob/main/POMIAR.md">POMIAR.md</a>. Czas z zegara telefonu — musi być ustawiany automatycznie.</p>
</header>
<div class="pasek-gora">
  <span class="zegar" id="zegar">--:--:--</span>
  <select id="przystanek" aria-label="Przystanek"></select>
</div>

<section class="karty" id="karty" aria-live="polite"></section>
<section class="lista" id="lista"></section>

<div class="dol">
  <button class="glowny" id="nowy" type="button">+ Pojazd</button>
  <button id="eksport" type="button">Eksport CSV</button>
  <button id="wyczysc" type="button">Wyczyść</button>
</div>

<script src="pomiar-logika.js?v=2e086404b2"></script>
<script src="pomiar.js?v=47745ff296"></script>
</body>
</html>
